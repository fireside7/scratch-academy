{% extends "base.html" %}

{% block title %}Sign Up{% endblock %}
{% block navbar %}{% endblock %}

{% block content %}
  <main class="container form-page">
    <article>
      <h1>Sign up</h1>

      <form method="POST" action="/sign-up">
        <div class="grid">
          <label for="first_name">First Name
            <input type="text" id="first_name" name="first_name" autocomplete="given-name" required>
          </label>

          <label for="last_name">Last Name
            <input type="text" id="last_name" name="last_name" autocomplete="family-name" required>
          </label>
        </div>

        <label for="email">Email
          <input type="email" id="email" name="email" autocomplete="email" required>
        </label>

        <label for="phone_number">Phone Number
          <input type="tel" id="phone_number" name="phone_number" autocomplete="tel" required>
        </label>

        <label for="password">Password
          <input type="password" id="password" name="password" autocomplete="new-password" required>
        </label>

        <button type="submit">Sign Up</button>
      </form>

      <footer><a href="/">← Back to Homepage</a></footer>
    </article>
  </main>
{% endblock %}
